[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-classifier"
version = "0.1.0"
description = "EfficientNetB0 transfer-learning classifier for vehicle images (airplanes/cars/ship)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
